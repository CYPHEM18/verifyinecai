<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VerifyINEC</title>
<style>
  :root { --bg:#f6f7f5; --card:#fff; --text:#16201a; --muted:#5b6b61; --line:#dfe5e0; --green:#0a7a43; --amber:#b86e00; --red:#c0281d; --grey:#5b6b61; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101512; --card:#18201b; --text:#e8efe9; --muted:#9fb0a5; --line:#2a352d; --green:#3ec47d; --amber:#f0a030; --red:#ff6b5f; --grey:#9fb0a5; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:680px; margin:0 auto; padding:20px 16px 48px; }
  h1 { margin:8px 0 4px; font-size:26px; } .sub { color:var(--muted); margin:0 0 18px; }
  textarea { width:100%; min-height:140px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font:inherit; resize:vertical; }
  button { margin-top:10px; width:100%; padding:13px; border:0; border-radius:10px; background:var(--green); color:#fff; font:600 16px inherit; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
  .badge { display:inline-block; padding:4px 12px; border-radius:99px; color:#fff; font-weight:700; text-transform:uppercase; font-size:13px; }
  .safe { background:var(--green); } .suspicious { background:var(--amber); } .dangerous { background:var(--red); } .unverified { background:var(--grey); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 0 6px; }
  .chip { display:inline-block; margin:0 6px 6px 0; padding:2px 10px; border:1px solid var(--line); border-radius:99px; font-size:13px; }
  .item { border-top:1px solid var(--line); padding:8px 0; font-size:14px; overflow-wrap:anywhere; }
  .item:first-of-type { border-top:0; }
  .quote { color:var(--muted); font-style:italic; }
  .note { color:var(--muted); font-size:13px; margin-top:14px; }
</style>
</head>
<body>
<main>
  <h1>VerifyINEC</h1>
  <p class="sub">Paste a suspicious message, link or claim about the election. AI checks it against official sources.</p>
  <textarea id="msg" maxlength="2000" placeholder="Paste a WhatsApp or SMS message here…"></textarea>
  <button id="go">Check this message</button>
  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

function section(parent, title) { parent.appendChild(el('h2', '', title)); }

function render(d) {
  const out = $('out'); out.replaceChildren();
  const card = el('div', 'card'); out.appendChild(card);
  card.appendChild(el('span', 'badge ' + d.verdict, d.verdict));
  card.appendChild(el('p', '', d.explanation));
  if (d.explanation_local && d.explanation_local !== d.explanation) card.appendChild(el('p', 'quote', d.explanation_local));
  if (d.advice) { section(card, 'What to do'); card.appendChild(el('p', '', d.advice)); }

  if (d.tactics && d.tactics.length) {
    section(card, 'Tactics detected');
    d.tactics.forEach((t) => card.appendChild(el('span', 'chip', t)));
  }
  if (d.claims && d.claims.length) {
    section(card, 'Claims checked');
    d.claims.forEach((c) => {
      const row = el('div', 'item');
      row.appendChild(el('strong', '', c.status + ': '));
      row.appendChild(document.createTextNode(c.claim || ''));
      if (c.quote) row.appendChild(el('div', 'quote', '“' + c.quote + '”'));
      if (c.source_url) row.appendChild(el('div', 'quote', c.source_url));
      if (c.note) row.appendChild(el('div', 'quote', c.note));
      card.appendChild(row);
    });
  }
  if (d.sources && d.sources.length) {
    section(card, 'Sources consulted');
    d.sources.forEach((src) => {
      const row = el('div', 'item');
      row.appendChild(el('span', 'chip', src.tier));
      row.appendChild(document.createTextNode((src.title || src.url) + ' — ' + src.url));
      card.appendChild(row);
    });
  }
  if (d.evidence && d.evidence.length) {
    section(card, 'Link checks');
    d.evidence.forEach((e) => {
      const flags = [];
      flags.push(e.in_registry ? 'official INEC domain' : 'not an official INEC domain');
      if (e.lookalike_of) flags.push('imitates ' + e.lookalike_of);
      if (e.punycode) flags.push('disguised characters');
      if (e.shortener) flags.push('shortened link');
      card.appendChild(el('div', 'item', e.host + ' — ' + flags.join(', ')));
    });
  }
  if (!d.ai_used) card.appendChild(el('p', 'note', 'AI analysis was unavailable, so only technical checks were used.'));
}

$('go').addEventListener('click', async () => {
  const text = $('msg').value.trim();
  if (!text) return;
  const btn = $('go'); btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const r = await fetch('/api/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error('Server error ' + r.status);
    render(await r.json());
  } catch (e) {
    $('out').replaceChildren(el('div', 'card', 'Something went wrong: ' + e.message));
  } finally {
    btn.disabled = false; btn.textContent = 'Check this message';
  }
});
</script>
</body>
</html>
